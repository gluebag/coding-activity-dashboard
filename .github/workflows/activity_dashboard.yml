name: GitHub Activity Tracker

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays at midnight
  workflow_dispatch:     # Allow manual trigger

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib seaborn PyGithub python-dotenv
          
      - name: Generate activity report
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: python activity_tracker.py
        
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
        
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: './dashboard'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        
      - name: Commit and push updated reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard/
          git add reports/
          git commit -m "Update activity dashboard (automated)" || echo "No changes to commit"
          git push
